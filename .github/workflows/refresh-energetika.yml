name: Refresh energetika prices

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate report
        run: python3 energetika_prices.py --build-html energetika.html

      - name: Commit if data changed
        run: |
          new=$(grep -o 'application/json">\[.*\]</script>' energetika.html || true)
          old=$(git show HEAD:energetika.html | grep -o 'application/json">\[.*\]</script>' || true)
          if [ "$new" = "$old" ]; then
            echo "No data changes; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energetika.html
          git commit -m "Refresh energetika prices report"
          git push
